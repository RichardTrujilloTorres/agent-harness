# yaml-language-server: $schema=../../schema/scenario.schema.json
name: Happy path booking
persona: A friendly customer who answers every question
goal: Book a table for 4 on Saturday at 20:00
user:
  mode: scripted
  turns:
    - "Hi, I'd like to book a table for 4"
    - "Saturday at 8pm"
    - "My name is Anna"
max_turns: 5
expect:
  - tool_called:
      name: create_booking
      args:
        party_size: 4
        day: saturday
        time: "20:00"
        name: Anna
  - said: confirmed
  - handoff: false
  - max_turns: 3
  - latency_ms_under: 2000
