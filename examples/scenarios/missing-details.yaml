name: Missing details, agent asks for the name
persona: A customer who forgets to give a name
goal: The agent asks for the missing name instead of booking
user:
  mode: scripted
  turns:
    - "Book a table for 2 on Friday at 19:30"
max_turns: 2
expect:
  - said: name
  - never_said: confirmed
  - handoff: false
