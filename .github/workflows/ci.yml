name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer validate --strict

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: vendor/bin/pest

      - run: vendor/bin/phpstan analyse --no-progress

      - run: bin/agent-harness validate examples/scenarios

      - name: Demo run (2 scenarios fail on purpose, so exit 1 is expected)
        run: |
          php -S 127.0.0.1:8787 -t examples/demo-agent/public > /dev/null 2>&1 &
          for i in $(seq 1 50); do nc -z 127.0.0.1 8787 && break; sleep 0.1; done
          bin/agent-harness run examples/scenarios --url http://127.0.0.1:8787/chat || test $? -eq 1
