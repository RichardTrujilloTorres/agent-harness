name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: pcov
          ini-values: phar.readonly=0
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Tag must equal Application::VERSION
        run: |
          version="${GITHUB_REF_NAME#v}"
          app=$(php -r 'require "vendor/autoload.php"; echo Desemax\AgentHarness\Application::VERSION;')
          if [ "$version" != "$app" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Application::VERSION $app" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: CHANGELOG must have a section for the version
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > build-notes.md
          if [ ! -s build-notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
      - name: All quality gates, including the PHAR build and smoke test
        run: composer check:ci
      - name: Checksums
        run: |
          cd build
          sha256sum agent-harness.phar > agent-harness.phar.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/agent-harness.phar
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file build-notes.md \
            --verify-tag \
            build/agent-harness.phar build/agent-harness.phar.sha256
