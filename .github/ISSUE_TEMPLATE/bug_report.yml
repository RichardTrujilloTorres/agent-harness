name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: A minimal scenario file, harness.yaml (without secrets) and the agent response, or a failing Pest test.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The output of the command, ideally with -v or --format=json. Remove any secrets.
      render: text
  - type: input
    id: version
    attributes:
      label: agent-harness version
      placeholder: "agent-harness --version"
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version and OS
      placeholder: "PHP 8.3.x on Ubuntu 24.04"
    validations:
      required: true
